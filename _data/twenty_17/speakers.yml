- title: Jeremie Poschmann
  name: Jeremie
  subtitle: PI at Université de Nantes
  img: jeremie.jpeg
  thumbnail: jeremie_thumb.jpeg
  alt: Picture of Jeremie
  topic: TBD
  description: Jeremie leads a genomics and bioinformatics research group within Team 6 and manages the center's single-cell platform. Alongside Professor Antoine Roquilly, Jeremie co-leads Team 6, which focuses on studying host-pathogen interactions, inflammation, and mucosal immunity. His group uses multi-omics approaches, including epigenomics and single-cell genomics, integrating these techniques with other types of omics data. Their research aims to identify molecular patterns associated with disease, emphasizing the role of immune cells in inflammation and uncovering specific disease signatures and mechanisms. The team's main goal is to understand the complexities of immune responses during bacterial infections through studies involving both human and animal models. They particularly focus on immune cell changes triggered by acute inflammatory stress, especially examining the behavior of mononuclear phagocytes and T cells.

- title: Massimo Nichane
  name: Massimo
  subtitle: Researcher at Stanford Institute
  img: massimo.jpeg
  thumbnail: massimo_thumb.jpeg
  alt: Picture of Massimo
  topic: Multipotent embryonic progenitors for lung regeneration
  description: In response to acute or chronic insults, adult organs without a dedicated stem cell mobilize distinct mature cells or facultative progenitors with limited regenerative abilities, which often results in development of abnormal repair and, in some case, organ failure. In contrast, during embryonic development, various organs and tissues are elaborated from transient multipotent stem or progenitor cells. Previously, I have shown that embryonic lung progenitors can be isolated and expanded in vitro, engraft the adult lung in vivo, and regenerate the full repertoire of lung epithelial cell types. Here, I further demonstrate that adult somatic cells can be directly reprogrammed into embryonic lung progenitor-like cells and used for cell transplant and in vivo tissue repair. These artificially-engineered embryonic cells display proliferative, transcriptional, and functional properties analogous to native embryonic progenitors. Transplantation of these synthetic cells substantially repair damaged lung tissue by generating new functional alveoli (the gas-exchange units) and improved long-term survival and pulmonary function of experimental mice with severe lung injury and fibrosis. Ultimately, I propose that synthetic multipotent embryonic cells with broader regenerative potential instead of adult cells could serve as an effectivel strategy for repair of permanently damaged adult organs.

- title: Ricardo del Rosario
  name: Ric
  subtitle: Computational Biologist at Broad Institute
  img: ric.jpeg
  thumbnail: ric_thumb.jpeg
  alt: Picture of Ric
  topic: Marmoset brains harbor the microglia of their birth sibling
  description: Chimerism happens rarely among most mammals but is common in marmosets and tamarins, a result of fraternal twin or triplet birth patterns in which in utero connected circulatory systems (through which stem cells transit) lead to persistent blood chimerism (12-80%) throughout life. We analyzed single-cell RNA-seq data from blood, liver, kidney and multiple brain regions across a number of marmosets, using transcribed single nucleotide polymorphisms (SNPs) to identify cells with the sibling's genome in various cell types within these tissues. Sibling-derived chimerism in all tissues arose entirely from cells of hematopoietic origin (i.e., myeloid and lymphoid lineages). In brain tissue this was reflected as sibling-derived chimerism among microglia (20-52%) and macrophages (18-64%) but not among other resident cell types (i.e., neurons, glia or ependymal cells). The percentage of microglia that were sibling-derived showed significant variation across brain regions, even within individual animals, likely reflecting distinct responses by siblings' microglia to local recruitment or proliferation cues or, potentially, distinct clonal expansion histories in different brain areas. In the animals and tissues we analyzed, microglial gene expression profiles bore a much stronger relationship to local/host context than to sibling genetic differences. Naturally occurring marmoset chimerism will provide new ways to understand the effects of genes, mutations and brain contexts on microglial biology and to distinguish between effects of microglia and other cell types on brain phenotypes.

- title: Andreas Wilm
  name: Andreas
  subtitle: Senior Director, Computational Biology, ImmunoScape
  img: andreas.png
  thumbnail: andreas_thumb.png
  alt: Picture of Andreas
  topic: In-silico TCR discovery and safety profiling
  description: TCR-T cell therapeutics represent a promising approach in the treatment of solid tumors, harnessing the incredible diversity and specificity of T cell receptors to recognize and target specific tumor antigens. At ImmunoScape, we combine mass spectrometry-based, mulitplexed identification and sequencing-based deep profiling of antigen-specific T cells to discover novel T cell-based therapeutics. This talk will explore how machine learning can leverage the data created by this platform to identify more and better TCRs. Additionally, I will discuss how computational methods can accelerate crucial pre-clinical safety checks, such as assessing cross-reactivity against self-antigens, to streamline the development of safe and efficacious TCR-T cell therapies.

- title: Ralf Jauch
  name: Ralf
  subtitle: Professor at The University of Hong Kong (HKU)
  img: ralf.png
  thumbnail: ralf_thumb.png
  alt: Picture of Ralf
  topic: Which tools did the grand grandmother of all cells use to create animals?
  description: The unicellular ancestor of all animals appeared around 700 million years ago. We found that critical tools used in animal stem cells are even older than that, and ancestral pre-animal versions of animal stem cell factors can induce pluripotency in modern mice. This makes us wonder which evolutionary innovations paved the way for animal stem cells and multicellular life.

