- title: Benjarath P. Javed
  name: Bam
  subtitle: Research Scientist, Chulabhorn Research Institute
  img: bam.jpg
  thumbnail: bam_thumb.jpg
  alt: Picture of Bam
  topic: The landscape of etiological patterns of hepatocellular carcinoma and intrahepatic cholangiocarcinoma in Thailand
  description: 'Thailand is among countries with the highest global incidence and mortality rates of hepatocellular carcinoma (HCC) and intrahepatic cholangiocarcinoma (iCCA). While viral hepatitis and liver fluke infections have been associated with HCC and iCCA, respectively, other environmental risk factors, overall risk factor commonality and combinatorial roles, and effects on survival have not been systematically examined. We conducted a TIGER-LC consortium-based population study covering all high-incidence areas of both malignancies across Thailand: 837 HCC, 1474 iCCA, and 1112 controls (2011–2019) were comprehensively queried on lifelong environmental exposures, lifestyle, and medical history. Multivariate logistic regression and Cox proportional hazards analyses were used to evaluate risk factors and associated survival patterns. Our models identified shared risk factors between HCC and iCCA, such as viral hepatitis infection, liver fluke infection, and diabetes, including novel and shared associations of agricultural pesticide exposure (OR range of 1.50; 95% CI: 1.06–2.11 to 2.91; 95% CI: 1.82–4.63) along with vulnerable sources of drinking water. Most patients had multiple risk factors, magnifying their risk considerably. Patients with lower risk levels had better survival in both HCC (HR 0.78; 95% CI: 0.64–0.96) and iCCA (HR 0.84; 95% CI: 0.70–0.99). Risk factor co-exposures and their common associations with HCC and iCCA in Thailand emphasize the importance for future prevention and control measures, especially in its large agricultural sector. The observed mortality patterns suggest ways to stratify patients for anticipated survivorship and develop plans to support medical care of longer-term survivors, including behavioral changes to reduce exposures.'

- title: Asif Javed
  name: Asif
  subtitle: Research Scientist II,  Chulabhorn Research Institute
  img: asif.jpeg
  thumbnail: asif_thumb.jpeg
  alt: Picture of Asif
  topic: Understanding leukemia through a multi-omics lens
  description: 'Leukemia is a growing medical burden in developed countries. It is estimated that 1.5% of the ageing population will succumb to it. Historically, it has been a trailblazer in cancer studies. Its low mutation rate allows for ease of interpretation of genetic variants observed. However, lurking behind this simple genomic profile are epigenomic changes, perturbed regulatory mechanisms, and cellular and functional diversity along different differentiation lineages. Altogether, these paint a complex canvas contributing to the clinical and functional heterogeneity in the patients and eventually their drug response and prognosis. I will share my work towards understanding this diversity in myeloid leukemias relying on multi-omics bulk and single cell evaluations of primary samples.'

- title: Michael Rossbach
  name: Michael
  subtitle: Prof. TUM Asia, CEO Ikxinta Group, CEO Orpheus Bioscience, CTO Axiom Insights
  #, Partner Eckuity Capital
  img: michael.jpeg
  thumbnail: michael_thumb.jpeg
  alt: Picture of Michael
  topic: X-ray fluorescence imaging (XFI) for in-vivo immune cell tracking
  description: 'The infiltration of immune cells into inflamed tissues is a central feature of immune-mediated inflammatory diseases. Gaining detailed insights into the in vivo behavior of specific immune cell subsets is essential for improving our understanding of disease mechanisms and for guiding the development of targeted therapies. In our work, we present an advanced X-ray fluorescence imaging (XFI) approach capable of quantitatively tracking immune cells in vivo, offering unique advantages over conventional imaging techniques. This capability is enabled by a rigorous characterization of spectral background noise, particularly from multiple Compton scattering, in a mouse-sized model scanned with a monochromatic pencil X-ray beam from a synchrotron source. Under optimized conditions, the imaging system achieves sufficient sensitivity to detect localized accumulations of labeled immune cells, thus providing experimental validation of non-invasive immune cell tracking in live mice. This technology holds promise for preclinical studies aiming to monitor immune responses and evaluate therapeutic interventions in real time.'


- title: Aleksander Jankowski
  name: Aleks
  subtitle: Assistant Professor at the University of Warsaw
  img: aleks.jpg
  thumbnail: aleks_thumb.jpg
  topic: Regulatory role of long-range chromatin interactions
  description: Three-dimensional folding of the genome plays an essential role in ensuring appropriate readout of genetic information, with topologically associating domains (TADs) being the basic unit of chromatin organization. I will discuss approaches to dissect the regulatory role and mechanisms behind long-range chromatin interactions. First, I will present a recently identified level of genome folding in Drosophila, where distant TAD pairs, located megabases apart, interact to form meta-domains. The formation of meta-domains relies on diverse transcription factors that are able to pair over long and flexible distances, driving focused long-range contacts between elements from the interacting TADs. Second, I will present a computational approach to detect trans-homologous chromatin interactions between chromosomes forming homologous pairs in the genome. Of functional relevance are combinations of genomic elements which exhibit significantly different frequency of trans-homologous interactions compared to the cis-homologous counterpart. Finally, I will introduce a computational method to identify enriched functional terms in a set of gene pairs defined by chromatin interactions.

- title: Sivakamaundari Vijayakumar
  name: Siva
  img: siva.jpg
  thumbnail: siva_thumb.jpg
  subtitle: Researcher at Stanford Institute
  topic: "Reversible and Irreversible Injuries: Cells & Signals In Regeneration, And The Right Tools"
  description: "Tissues may appear static during homeostasis, but in reality, a dynamic network of signals exchanged between cells creates the &quot;niche&quot; that regulates the timing of proliferation and differentiation to support regeneration. In this talk, I will discuss the role of one such developmental signal—the Hedgehog signaling pathway—in maintaining glandular tissue and enabling regeneration following mild (mechanical) injury versus severe radiation-induced injury. The cellular composition—and the niche it establishes— influences whether an injury is reversible or progresses toward diseased states such as cancer. Finally, from a biologist's perspective, I will address current challenges in extracting mechanistic insights from low- resolution data in the era of 'big data' in tissue biology."
